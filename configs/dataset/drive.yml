model:
    arch: runet
    steps: 3
    hidden_size: 32
    initial: 1
    gate: 2
    feature_scale: 4
    unet_level: 4
    recurrent_level: -1
    structure: ours
data:
    dataset: drive
    train_split: train
    val_split: test
    test_split: test
    img_rows: 576
    img_cols: 576
    orig_size: (565,584)
    path: ./data/drive
#    path: /home/kyu/.keras/datasets/egohands_data
training:
    train_iters: 12000
    batch_size: 1
    val_interval: 30
    n_workers: 0
    print_interval: 5
    optimizer:
        name: 'sgd'
        lr: 1.0e-3
        weight_decay: 0.0005
        momentum: 0.9
    loss:
        name: 'multi_step_cross_entropy'
        reduction: 'sum'
        scale_weight: 1.0
    lr_schedule:
        name: 'StepLR'
        lr_decay_step_size: 180
        lr_decay_factor_gamma: 0.95
    resume:
