model:
  arch: runet
  steps: 3
  hidden_size: 16
  feature_scale: 8
  initial: 1
  gate: 2
  unet_level: 4
  recurrent_level: -1
  structure: ours
data:
  dataset: epfl_hand
  train_split: train
  val_split: val
  test_split: test
  img_rows: 288
  img_cols: 224
  path: ./data/epfl_hand
training:
  train_iters: 8000
  batch_size: 2
  val_interval: 500
  n_workers: 0
  print_interval: 50
  optimizer:
    name: sgd
    lr: 0.001
    weight_decay: 0.0005
    momentum: 0.9
  loss:
    name: multi_step_cross_entropy
    reduction: sum
    scale_weight: 0.4
  lr_schedule:
    name: StepLR
    lr_decay_step_size: 3600
    lr_decay_factor_gamma: 0.95
  resume: null
